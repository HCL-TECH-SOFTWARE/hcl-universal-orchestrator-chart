{{ $fullName := include "fullname" . }}

{{- $root := . -}}
{{- $min := (coalesce ($root.Values.deployment.extras).minTargetReplicas $root.Values.deployment.global.minTargetReplicas) }}
{{- $max := (coalesce ($root.Values.deployment.extras).maxTargetReplicas $root.Values.deployment.global.maxTargetReplicas) }}

{{- if and .Values.global.extraImages (gt $max $min) }}
{{- $extraImageList := include "uno.extraImages" . | fromJsonArray -}}
{{- range $index, $extraImage := $extraImageList -}}

{{- if $root.Capabilities.APIVersions.Has "autoscaling/v2" }}
apiVersion: autoscaling/v2
{{- else if $root.Capabilities.APIVersions.Has "autoscaling/v2beta2" }}
apiVersion: autoscaling/v2beta2
{{- else }}
apiVersion: autoscaling/v1
{{- end }}
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-{{ $fullName }}-extra-{{ $index }}
  labels:
{{ include "uno.common.label" $root | indent 4 }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullName }}-extra-{{ $index }}
  minReplicas: {{ $min }}
  maxReplicas: {{ $max }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ coalesce (($root.Values.deployment.extras).autoscaler).cpuAverageUtilization $root.Values.deployment.global.autoscaler.cpuAverageUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max

---
{{- end}}
{{- end}}
