global:
  uno:
    engineHost: ""
    enginePort: ""
  enableMultitenant: "false"
  hclImagePullSecret: entitledregistry

#Version Tracking
track: dev
common:
  autoscaler:
    enabled: false
    # minTargetReplicas defines the minimum number of pod replicas for each service.
    # IMPORTANT: This value is used as:
    #   1. The default/static replica count when HPA is disabled (no autoscaling)
    #   2. The minimum replica count when HPA is enabled (HPA won't scale below this)
    # The deployment replicas field is set to this value by default.
    # To override per service, set minTargetReplicas in the service-specific section (e.g., ams.autoscaler.minTargetReplicas)
    minTargetReplicas: 1
    # maxTargetReplicas defines the maximum number of pod replicas for each service.
    # Used only when HPA is enabled. When HPA is disabled, replicas stay at minTargetReplicas (static).
    # To override per service, set maxTargetReplicas in the service-specific section (e.g., ams.autoscaler.maxTargetReplicas)
    maxTargetReplicas: 3
    # cpuAverageUtilization triggers autoscaler when average CPU usage exceeds this percentage.
    # Only applies when HPA is enabled.
    cpuAverageUtilization: 200
  # Pod Disruption Budget Configuration
  podDisruptionBudget:
    # enabled specifies whether a PodDisruptionBudget is enabled. Supported values are true and false.
    enabled: false
    # maxUnavailable is the maximum number, or percentage, of unavailable pods during the disruption.
    maxUnavailable: "33%"
  # Resource Configuration for all services, can be overridden at the service level
  resources:
    limits:
      cpu: 1000m
      memory: 2500Mi
    requests:
      cpu: 300m
      memory: 500Mi
  valkey:
    valkeyPasswordSecret : "valkey-password-secret"
    valkeyPasswordSecretKey: "password"
    valkeyPassword : ""
    valkeyHost: "valkey"
    valkeyPort: "6379"
    valkeyDb: "0"
    valkeyUser:
    valkeyIAMAuthenticationEnabled: "false"
    valkeyIAMServiceAccount: ""
    valkeyIAMScopes: "https://www.googleapis.com/auth/cloud-platform"
    valkeyClusterModeEnabled: "false"
    valkeyApplicationPrefix: "agenticbuilder"
    ssl:
      enabled: "false"
      # Client Configuration for Mutual TLS
      certSecretName: ""
      #By default the SecretKey is "tls.crt", you can override it by specifying the
      certSecretKey: ""

      certKeySecretName: ""
      #By default the SecretKey is "tls.key", you can override it by specifying the
      certKeySecretKey: ""
      
      certKeyPassword: ""
      # Optional CA for Mutual TLS, If not provided the trustore CA will be used
      certCaSecretName: ""
      # By default the SecretKey is "ca.crt", you can override it by specifying the
      certCaSecretKey: ""
      # Client Configuration for One-way TLS to verify server certificate
      caSecretName: ""
      # By default the SecretKey is "ca.crt", you can override it by specifying the caSecretKey
      caSecretKey: ""
      # Whether to validate the hostname in the Valkey certificate
      hostnameValidation : "true"

  postgres:
    #The postgres User used by the application
    postgresUser: agenticbuilder
    #The postgres port
    postgresPort : "5432"
    #The postgres database name
    postgresDB: "agenticbuilder"
    #The postgres service name
    postgresService: '{{ printf "%s-%s" .Release.Name "pg-db" | trunc 21 | trimSuffix "-"  }}-primary'
    # The postgres user password, if not set it will be generated and stored in a secret called {{ .Release.Name }}-postgres-password
    #postgresPassword: "" 
    #postgresPasswordSecretName: "{{ include \"agenticbuilder.fullname\" . }}-postgres-password"
    #postgresPasswordSecretKey: "postgres-password"
    # Only to let the init container create the database "$postgresDB" if it does not exist
    # Postgres Client connection timeout in seconds
    connectTimeout: "60"
    # Application name to be used in the Postgres connection
    applicationName: "agenticbuilder-app"
    # Additional connection options
    options: ""
    # Client Required Authentication for Postgres connection ( scram-sha-256, md5, password, gss, sspi, ident, peer, ldap, none)
    requiredAuthentication : "scram-sha-256"
    #### Those settings are for Creating The user and the database if not present ####
    # Those values will not be used by the application, only in the initContainer for the initialization of the DB #
    initDatabases: true
    # Database used by the admin connection during init containers.
    # Keep this pointed to an existing administrative database.
    postgresAdminSessionDB: "postgres"
    postgresAdminUserSecretName: '{{ printf "%s-%s" .Release.Name "pg-db" | trunc 21 | trimSuffix "-"  }}-pguser-postgres'
    postgresAdminUserSecretKey: "user"
    postgresAdminPasswordSecretName: '{{ printf "%s-%s" .Release.Name "pg-db" | trunc 21 | trimSuffix "-"  }}-pguser-postgres'
    postgresAdminPasswordSecretKey: "password"

    # SSL Configuration for Postgres connection
    ssl:
      enabled: "false"
      # Client Configuration for Mutual TLS
      certSecretName: ""
      #By default the SecretKey is "tls.crt", you can override it by specifying the
      certSecretKey: ""

      certKeySecretName: ""
      #By default the SecretKey is "tls.key", you can override it by specifying the
      certKeySecretKey: ""
      
      certKeyPassword: ""
      # Optional CA for Mutual TLS, If not provided the trustore CA will be used
      certCaSecretName: ""
      # By default the SecretKey is "ca.crt", you can override it by specifying the
      certCaSecretKey: ""
      # Client Configuration for One-way TLS to verify server certificate
      caSecretName: '{{ printf "%s-%s" .Release.Name "pg-db" | trunc 21 | trimSuffix "-"  }}-cluster-cert'
      # By default the SecretKey is "ca.crt", you can override it by specifying the caSecretKey
      caSecretKey: "" 

      # SSL Mode for Postgres connection ( disable, allow, prefer, require, verify-ca, verify-full)
      sslMode : "prefer"
      # Whether to validate the hostname in the Postgres certificate
      hostnameValidation : "true"

    # Additional CA secrets to be added to the truststore 
  truststore:
    agenticAdditionalCASecrets: 
  # Rest Client Configuration
  rest:
    timeout: "30"
    scheme: "https"
    # SSL Client Configuration
    ssl:
      enabled: "true"
      # Client Configuration for Mutual TLS
      certSecretName: ""
      #By default the SecretKey is "tls.crt", you can override it by specifying the
      certSecretKey: ""

      certKeySecretName: ""
      #By default the SecretKey is "tls.key", you can override it by specifying the
      certKeySecretKey: ""
      
      certKeyPassword: ""
      # Optional CA for Mutual TLS, If not provided the trustore CA will be used
      certCaSecretName: ""
      # By default the SecretKey is "ca.crt", you can override it by specifying the
      certCaSecretKey: ""
      # Client Configuration for One-way TLS to verify server certificate
      caSecretName: ""
      # By default the SecretKey is "ca.crt", you can override it by specifying the caSecretKey
      caSecretKey: "" 
      # Whether to validate the hostname in the server certificate
      hostnameValidation : "true"
  config:
    #Set the log level for the application, supported values are "DEBUG", "INFO", "WARN", "ERROR"
    logLevel: "INFO"
    enableAuthentication : "false"
    tokenProvider: ""
    tokenProviderOIDCServerURL:  ""
    tokenProviderDefaultRealm: ""
    tokenProviderClientId: ""
    tokenProviderClientSecret: ""
    tokenProviderOpenIdDiscovery: ""
    tokenProviderOidcRealmKey: ""
    tokenProviderCertPrivateKey: ""
    tokenProviderCertPublicKey: ""
    tokenProviderCertIssuer: ""
    tokenProviderCertExtraClaims: ""
    tokenProviderExpirationTimeInS: ""
    tokenProviderEnvVar: ""
    tokenProviderMockValue: ""
    OIDCServerUrl: ""
    OIDCClientId: ""
    keycloakRealm: ""

# Pilot Core Configuration
ams:
  # Name of the core service
  name: ams
  #Image name
  imageName: hcl-agentic-ams
  proxyURL: ""
  # Deployment strategy
  port: 8080
  autoscaler:
    # Optional override. If null, common.autoscaler.enabled is used.
    enabled: null
    # Optional override for minimum replica count. If null, uses common.autoscaler.minTargetReplicas.
    # This is the static replica count when HPA is disabled, or minimum when HPA is enabled.
    minTargetReplicas: null
    # Optional override for maximum replica count. If null, uses common.autoscaler.maxTargetReplicas.
    # Only used when HPA is enabled.
    maxTargetReplicas: null
    # Optional override for CPU threshold. If null, uses common.autoscaler.cpuAverageUtilization.
    cpuAverageUtilization: null
  podDisruptionBudget:
    # Optional override. If empty, common.podDisruptionBudget.enabled is used.
    enabled: null
    # Optional override. If empty, common.podDisruptionBudget.maxUnavailable is used.
    maxUnavailable: null
  # Resource Configuration
  config:
    exportedSchemasFolder :
  resources:
    limits:
      cpu: 1000m
      memory: 2500Mi
    requests:
      cpu: 300m
      memory: 1200Mi

credentialManager:
  # Name of the core service
  name: cm
  #Image name
  imageName: hcl-agentic-cm
  proxyURL: ""
  # Deployment strategy
  strategy:
    type: Recreate
  # The port on which the core service will be exposed
  port: 8000
  autoscaler:
    # Optional override. If null, common.autoscaler.enabled is used.
    enabled: null
    # Optional override for minimum replica count. If null, uses common.autoscaler.minTargetReplicas.
    # This is the static replica count when HPA is disabled, or minimum when HPA is enabled.
    minTargetReplicas: null
    # Optional override for maximum replica count. If null, uses common.autoscaler.maxTargetReplicas.
    # Only used when HPA is enabled.
    maxTargetReplicas: null
    # Optional override for CPU threshold. If null, uses common.autoscaler.cpuAverageUtilization.
    cpuAverageUtilization: null
  podDisruptionBudget:
    # Optional override. If empty, common.podDisruptionBudget.enabled is used.
    enabled: null
    # Optional override. If empty, common.podDisruptionBudget.maxUnavailable is used.
    maxUnavailable: null
  # Resource Configuration
  config:
    exportedSchemasFolder :
  # Optional override. If empty, common.resources is used.
  resources: null

runner:
  name: runner
  #Image name
  imageName: hcl-agentic-runner
  proxyURL: ""
  # The port on which the core service will be exposed
  port: 8080
  autoscaler:
    # Optional override. If null, common.autoscaler.enabled is used.
    enabled: null
    # Optional override for minimum replica count. If null, uses common.autoscaler.minTargetReplicas.
    # Runner has minTargetReplicas: 2 to ensure at least 2 running instances.
    # This is the static replica count when HPA is disabled, or minimum when HPA is enabled.
    minTargetReplicas: 2
    # Optional override for maximum replica count. If null, uses common.autoscaler.maxTargetReplicas.
    # Only used when HPA is enabled.
    maxTargetReplicas: null
    # Optional override for CPU threshold. If null, uses common.autoscaler.cpuAverageUtilization.
    cpuAverageUtilization: null
  podDisruptionBudget:
    # Optional override. If empty, common.podDisruptionBudget.enabled is used.
    enabled: null
    # Optional override. If empty, common.podDisruptionBudget.maxUnavailable is used.
    maxUnavailable: null
  # Resource Configuration
  config:
    a2aPublicBaseUrl: ""
    stateManager: "valkey"
    executorScheme : "https"
    maxAgents: 5
    #Long term memory configuration
    memoryType: "raw" # raw or chunked
    embeddingProvider : "huggingface"
    embeddingModel : "sentence-transformers/all-mpnet-base-v2"
    embeddingDimensions : "768"
    # Leave Empty to use the installed UnO
    unoMCPBaseURL : ""

  resources:
    limits:
      cpu: 2
      memory: 2560Mi
    requests:
      cpu: 500m
      memory: 1638Mi
uno:
  hostname: ""
  port: ""
  proxyURL: ""

iaa:
  hostname: ""
  port: ""
  proxyURL: ""

telemetry:
    # To enable telemetry
    enableTelemetry: "false"
    # The endpoint for traces 
    inferenceEndpoint : ""
    # The base URL for metrics
    telemetryBaseUrl : ""
    # The service name to be used in telemetry data
    telemetryServiceName: ""
    # The interval in milliseconds for exporting telemetry data
    telemetryExportIntervalMillis: "60000"
    # Protocol to be used for metrics export (http or grpc)
    telemetryMetricsProtocol: "http"
    # Protocol to be used for trace export (http or grpc)
    telemetryTraceProtocol: "http"
    #Set to "true" to disable TLS for trace export (useful for testing with insecure endpoints), supported values: "true" or "false"
    telemetryMetricInsecure: "true"
    # Set to "true" to disable TLS for trace export (useful for testing with insecure endpoints), supported values: "true" or "false"
    telemetryTraceInsecure: "true"
    # If your telemetry exporter requires a certificate, provide it here the secret name, the field telemetryTraceInsecure must be "false" or telemetryMetricInsecure must be "false"
    telemetryExporterCertificate: ""
    # If your telemetry exporter requires a certificate, provide it here the key inside the secret that points to the certificate, the field telemetryTraceInsecure must be "false" or telemetryMetricInsecure must be "false"
    telemetryExporterCertificateKey: "tls.crt"
    # If your telemetry exporter requires headers, provide them here in the format "key1=value1,key2=value2"
    telemetryExporterHeaders: ""
    # Timeout in milliseconds for the telemetry exporter
    telemetryExporterTimeoutMillis: "10000"
    # If your trace exporter requires different headers than metrics, provide them here in the format "key1=value1,key2=value2"
    telemetryExporterTraceHeaders: ""
    # Optional Langfuse credentials for OTLP trace export. Prefer the SecretName/SecretKey form for production.
    # Langfuse Public Key (used for trace export)
    langfusePublicKey: ""
    # Optional Secret reference for Langfuse Public Key (used if langfusePublicKey is not set)
    langfusePublicKeySecretName: ""
    # Optional Secret key for Langfuse Public Key (default: "public-key")
    langfusePublicKeySecretKey: "public-key"
    # Langfuse Secret Key (used for trace export)
    langfuseSecretKey: ""
    # Optional Secret reference for Langfuse Secret Key (used if langfuseSecretKey is not set)
    langfuseSecretKeySecretName: ""
    # Optional Secret key for Langfuse Secret Key (default: "secret-key")
    langfuseSecretKeySecretKey: "secret-key"

certificates:
  # No enable if you want to use customized certificates
  useCustomizedCert: false 
  # The secret name containing the CA to be used to sign the certificatesSecret
  caPairSecretName:
  # To enable if you want to use a custom issuer
  customIssuer: false
  # The organization name for the certificates
  organization: hcl
  # To select the duration before the certificates are renewed
  renewBefore: 360h
  # The duration for which the certificates are valid
  duration: 2160h
  # If you are using a custom issuer, specify the issuer name
  issuerName: ""
  # The secret name of the certificates secret
  certSecretName : ""
#To add configuration for the authorization mechanism
authorization:
  #EXAMPLE HCL_AUTHORIZATION_HTTPS___PILOT_CORE_5005: <secret-name >
  certs:
    #HCL_AUTHORIZATION_HTTPS___PILOT_CORE_5005: pilot-cert
    #HCL_AUTHORIZATION_HTTPS___WAJWT_API: "{{ .unofullname }}-jwt-key"
    #HCL_AUTHORIZATION_HTTPS___WAJWT_APIGATEWAY:  "{{ .unofullname }}-jwt-key"
    #HCL_AUTHORIZATION_HTTPS___WAJWT_MCP:  "{{ .unofullname }}-jwt-key"
    #HCL_AUTHORIZATION_TEST: /opt/certs/jwt/pilot-jwt.crt

  # TO ENABLE OIDC AUTHENTICATION
  oidcServerURL: ""

# Configuration for the images used in the deployment
image:
  # The registry where the image is hosted
  repository: hclcr.io/uno
  # The tag/version of the images
  tag: 2.1.7.0-beta1
  # The Pull Policy for the images
  imagePullPolicy: Always

  #Init containers images
  init:
    # Busybox image used in init containers for database initialization and other tasks, you can override it with any other image that has the required tools for your init containers, such as psql for Postgres initialization. The default value is "busybox:latest", but you can change it to fit your needs.
    busybox: busybox:latest
    # Postgres image used in the init container for Postgres database initialization, you can override it with any other image that has the required tools for your init container, such as psql for Postgres initialization. The default value is "postgres:latest", but you can change it to fit your needs.
    postgres: postgres:latest

# to configure if you want a custom service account
serviceAccount:
  name: ""

# If you don't want to use the .Release.Name as the prefix on the name of the service specify the name here
nameOverride: ""

# To add any additional labels to the deployment
podAnnotations: {}

# To configure the security context for the deployment
podSecurityContext: {}

# To configure the node selector for the deployment
nodeSelector: {}

# To configure the tolerations for the deployment
tolerations: []

# To configure the affinity for the deployment
affinity: {}

additionalPullSecret : ""

pgdb:
  crVersion: "v1"
  image: "docker.io/percona/percona-postgresql-operator:2.7.0-ppg17.5.2-postgres"
  port: 5432
  postgresVersion: 17
  pause: false
  unmanaged: false
  instanceName: "agentic-postgres"
  replicas: 1
  affinityLabel: "postgres"
  topologyKey: "kubernetes.io/hostname"
  storageSize: "5Gi"
  
  users:
    - name: postgres
      options: "SUPERUSER"

  resources:
    requests:
      memory: "850Mi"
      cpu: "500m"
    limits:
      memory: "1024Mi"
      cpu: "1000m"

  patroni:
    dynamicConfiguration:
      postgresql:
        pg_hba:
        - hostssl all all all md5 
        - hostssl all all all scram-sha-256
        - hostssl all all all cert
