{{- if include "agenticbuilder.autoscaler.enabled" (list . .Values.ams.autoscaler) -}}
{{ $fullname := include "agenticbuilder.fullname" . }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-{{ .Values.ams.name }}-hpa
  labels:
    {{- include "agenticbuilder.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-{{ .Values.ams.name }}
  minReplicas: {{ coalesce .Values.ams.autoscaler.minTargetReplicas .Values.ams.autoscaler.minReplicas .Values.common.autoscaler.minTargetReplicas 1 }}
  maxReplicas: {{ coalesce .Values.ams.autoscaler.maxTargetReplicas .Values.ams.autoscaler.maxReplicas .Values.common.autoscaler.maxTargetReplicas 10 }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ coalesce .Values.ams.autoscaler.cpuAverageUtilization .Values.common.autoscaler.cpuAverageUtilization 80 }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max
{{- end }}