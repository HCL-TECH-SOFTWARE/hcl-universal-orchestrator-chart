{{- if include "agenticbuilder.pdb.enabled" (list . .Values.credentialManager.podDisruptionBudget) -}}
{{ $fullname := include "agenticbuilder.fullname" . }}

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ .Values.credentialManager.name }}-pdb
  labels:
    {{- include "agenticbuilder.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ coalesce .Values.credentialManager.podDisruptionBudget.maxUnavailable .Values.common.podDisruptionBudget.maxUnavailable "33%" | quote }}
  selector:
    matchLabels:
{{ include "agenticbuilder.selectorLabels.backend" (list . .Values.credentialManager) | indent 6 }}
{{- end }}
