{{- $root := .  -}}
{{- if include "agenticbuilder.autoscaler.enabled" (list $root $root.Values.runner.autoscaler) -}}
{{- $deploymentType := include "agenticbuilder.runner.list" $root | fromJsonArray -}}
{{- range $deploymentType}}
{{- $currentDeploymentType := . -}}

{{ $fullname :=  include "agenticbuilder.fullname" $root }}
{{ $unoFullName := include "uno.fullname" $root }}
{{- $runnerName := printf "%s-%s-%s" $fullname $root.Values.runner.name $currentDeploymentType }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $runnerName }}-hpa
  labels:
    {{- include "agenticbuilder.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ $runnerName }}
  minReplicas: {{ coalesce $root.Values.runner.autoscaler.minTargetReplicas $root.Values.runner.autoscaler.minReplicas $root.Values.common.autoscaler.minTargetReplicas 1 }}
  maxReplicas: {{ coalesce $root.Values.runner.autoscaler.maxTargetReplicas $root.Values.runner.autoscaler.maxReplicas $root.Values.common.autoscaler.maxTargetReplicas 10 }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ coalesce $root.Values.runner.autoscaler.cpuAverageUtilization $root.Values.common.autoscaler.cpuAverageUtilization 80 }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Max
---
{{- end}}
{{- end}}
